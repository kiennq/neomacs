[package]
name = "neomacs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone Rust binary for Neomacs (no C dependency)"
build = "build.rs"

[features]
default = ["video", "jit", "platform-allocator", "neo-term"]
# Use the memory-efficient allocator on Linux without changing the established
# allocator on macOS and Windows.
platform-allocator = ["dep:neomacs-allocator"]
# Use mimalloc as the global allocator. Select this instead of `jemalloc` when
# allocation throughput matters more than settled resident memory.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# Use TiKV's jemalloc fork as the global allocator. This is the Linux production
# default because it packs Doom's long-lived heap into substantially less
# resident memory. These allocator features affect Rust allocations only, not
# linked C libraries. `--no-default-features` with neither feature drops back
# to the system allocator.
jemalloc = ["dep:tikv-jemallocator"]
# Compile jemalloc's heap profiler and allocator statistics into a jemalloc
# build. Sampling remains inactive unless enabled at runtime through
# `_RJEM_MALLOC_CONF`.
jemalloc-profiling = [
    "jemalloc",
    "tikv-jemallocator/profiling",
    "tikv-jemallocator/stats",
]
# Tiered Cranelift JIT for the Elisp VM. Qualified (soak/fuzzer/TSan clean) and
# a measured win even on Doom startup (~5% fewer instructions; interpreter
# dispatch cut ~60%), so it ships on by default. Build `--no-default-features`
# (plus the features you want) to get the interpreter-only binary.
jit = ["neovm-core/jit"]
# Diagnostics-only: thread neovm-core's `vm-profile` feature (execution-weighted
# OP-MIX + per-builtin SUBR-MIX with the Op::Call-vs-CallBuiltinSym entry split)
# into the binary, and expose the `neovm--vm-profile-reset` / `-dump` debug
# subrs so a batch editing session can be profiled. Off by default; adds a
# thread-local histogram bump per dispatched op/call (real cost — profiling
# builds only). Run profiling sessions with `NEOVM_JIT=0`.
vm-profile = ["neovm-core/vm-profile"]
neo-term = ["neomacs-display-runtime/neo-term"]
video = ["neomacs-display-runtime/video"]
wpe-webkit = ["neomacs-display-runtime/wpe-webkit"]

[[bin]]
name = "neomacs"
path = "src/main.rs"
test = false

[[bin]]
name = "mock-display"
path = "src/bin/mock-display.rs"
test = false

[[bin]]
name = "neomacsclient"
path = "src/bin/neomacsclient.rs"
test = false


[dependencies]
neomacs-display-protocol.workspace = true
neomacs-display-runtime = { workspace = true, default-features = false }
neomacs-allocator = { workspace = true, optional = true }
neomacs-layout-engine.workspace = true
neomacs-diagnostics.workspace = true
neovm-core.workspace = true
serde.workspace = true
serde_json = "1"
mimalloc = { version = "0.1", optional = true, default-features = false }
libmimalloc-sys = { version = "0.1", optional = true, default-features = false, features = ["extended"] }
tikv-jemallocator = { version = "0.7", optional = true, default-features = false }

# Utilities
tracing.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
crossterm = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
hostname.workspace = true
tempfile.workspace = true
stacker.workspace = true

[build-dependencies]
pkg-config.workspace = true

[lints]
workspace = true
