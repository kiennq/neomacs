name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_LOG: info

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: prepare release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
            prerelease=false
            make_latest=true
          else
            version="0.0.0.git.${GITHUB_SHA:0:12}"
            tag="v$version"
            prerelease=true
            make_latest=false
          fi
          tag_commit="$(git rev-parse --verify "${tag}^{commit}" 2>/dev/null || true)"
          if [[ -z "$tag_commit" ]]; then
            git tag "$tag" "$GITHUB_SHA"
          elif [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "release tag $tag points to $tag_commit, expected $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: NEO Emacs ${{ steps.metadata.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          make_latest: ${{ steps.metadata.outputs.make_latest }}

  # ── Linux x86_64 ──────────────────────────────────────────────────────
  build-linux-x86_64:
    name: build Linux x86_64
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install system dependencies (apt)
        run: scripts/ci/setup-linux.sh release

      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR"

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-linux-x86_64
          install-nextest: true

      - name: Install linuxdeploy
        uses: AnimMouse/setup-appimage@c8debfb91e47b03bf4bdc78a4b22fe14ebfaf7f5 # v2
        with:
          filename: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          cache_key: continuous

      - name: Install appimagetool
        uses: AnimMouse/setup-appimage@c8debfb91e47b03bf4bdc78a4b22fe14ebfaf7f5 # v2
        with:
          filename: appimagetool
          url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          cache_key: continuous

      - name: Build release binaries
        run: cargo xtask fresh-build --release --features neomacs-layout-engine/freetype-bundled

      - name: Configure release version
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1 ||
            git tag "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Package tarball (x86_64-unknown-linux-gnu)
        run: ./scripts/package-release.sh --target x86_64-unknown-linux-gnu --skip-build --no-smoke

      - name: Package AppImage
        run: ./scripts/package-appimage.sh --skip-build --no-smoke

      - name: Package .deb
        run: ./scripts/package-deb.sh --skip-build --no-smoke

      - name: Package .rpm
        run: ./scripts/package-rpm.sh --skip-build --no-smoke

      - name: Verify packaged artifacts and GLIBC baseline
        run: ./scripts/test-linux-release-artifacts.sh --tar-version "$VERSION"

      - name: Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          fail_on_unmatched_files: true

  # ── Linux aarch64 ─────────────────────────────────────────────────────
  build-linux-aarch64:
    name: build Linux aarch64
    needs: prepare-release
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install system dependencies (apt)
        run: scripts/ci/setup-linux.sh release

      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR"

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-linux-aarch64
          target: aarch64-unknown-linux-gnu

      - name: Build release binaries
        run: cargo xtask fresh-build --release --features neomacs-layout-engine/freetype-bundled

      - name: Configure release version
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1 ||
            git tag "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Package tarball (aarch64-unknown-linux-gnu)
        run: ./scripts/package-release.sh --target aarch64-unknown-linux-gnu --skip-build --no-smoke

      - name: Verify packaged artifact and GLIBC baseline
        run: |
          ./scripts/test-linux-release-artifacts.sh \
            --target aarch64-unknown-linux-gnu \
            --tar-version "$VERSION" \
            --formats tar

      - name: Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

  # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────────
  build-macos-aarch64:
    name: build macOS aarch64
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GSTREAMER_VERSION: 1.26.9
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install system dependencies (brew)
        run: brew install pkg-config gstreamer

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-macos-aarch64
          target: aarch64-apple-darwin

      - name: Configure release version
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1 ||
            git tag "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Build release binaries
        run: cargo xtask fresh-build --release --features neomacs-layout-engine/freetype-bundled

      - name: Package tarball (aarch64-apple-darwin)
        run: ./scripts/package-release.sh --target aarch64-apple-darwin --skip-build --no-smoke

      - name: Build and package .app + .dmg
        run: ./scripts/package-macos-app.sh --no-smoke

      - name: Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.dmg
          fail_on_unmatched_files: true

  # ── Windows x86_64 ────────────────────────────────────────────────────
  build-windows-x86_64:
    name: build Windows x86_64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 210
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GSTREAMER_VERSION: 1.26.9
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Restore GStreamer SDK cache
        id: cache-gstreamer
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}\PFiles64
            ${{ github.workspace }}\gstreamer-msi-cache
          key: windows-gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}-v3

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-windows-msvc-x86_64
          target: x86_64-pc-windows-msvc

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Configure release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1 ||
            git tag "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Build and package zip (x86_64-pc-windows-msvc)
        shell: pwsh
        timeout-minutes: 160
        run: |
          # pdump startup expands "~"; hosted Windows jobs may not define HOME.
          $env:HOME = if ($env:USERPROFILE) { $env:USERPROFILE } else { $env:GITHUB_WORKSPACE }
          ./scripts/emacs-build.ps1 -Version $env:VERSION

      - name: Save GStreamer SDK cache
        if: ${{ !cancelled() && steps.cache-gstreamer.outputs.cache-hit != 'true' && hashFiles('PFiles64/gstreamer/1.0/msvc_x86_64/bin/pkg-config.exe') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}\PFiles64
            ${{ github.workspace }}\gstreamer-msi-cache
          key: ${{ steps.cache-gstreamer.outputs.cache-primary-key }}

      - name: Package .exe installer
        shell: bash
        timeout-minutes: 20
        run: |
          source scripts/windows-gstreamer-env.sh
          ./scripts/package-windows-installer.sh --skip-build --no-smoke

      - name: Verify Windows installer ownership contract
        shell: powershell
        timeout-minutes: 10
        run: ./scripts/run-windows-installer-contract.ps1 -ConfirmEphemeralRunner

      - name: Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: true
