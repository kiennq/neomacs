name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: prepare release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
            prerelease=false
            make_latest=true
          else
            base_version="$(
              cargo metadata --no-deps --format-version 1 |
                jq -er '.packages[] | select(.name == "neomacs") | .version'
            )"
            version="${base_version}.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
            tag="v$version"
            prerelease=false
            make_latest=true
          fi
          tag_commit="$(git rev-parse --verify "${tag}^{commit}" 2>/dev/null || true)"
          if [[ -z "$tag_commit" ]]; then
            git tag "$tag" "$GITHUB_SHA"
          elif [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "release tag $tag points to $tag_commit, expected $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            git push origin "refs/tags/$tag"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: NEO Emacs ${{ steps.metadata.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          make_latest: ${{ steps.metadata.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: build Linux ${{ matrix.arch }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: dist/*.deb
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dist/*.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies (apt)
        run: scripts/ci/setup-linux.sh release

      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR"

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-linux-${{ matrix.arch }}
          cache-shared-key: ${{ matrix.arch == 'x86_64' && 'linux-x86_64-release' || '' }}
          cache-workspace-crates: true
          cache-save-if: ${{ matrix.arch != 'x86_64' }}
          target: ${{ matrix.target }}

      # Split so a compile failure is distinguishable from a bootstrap failure,
      # and so the expensive half is a step of its own.  The args must match
      # xtask's initial_cargo_build_args EXACTLY - it builds `-p neomacs` with
      # these features under this profile, and crates/neomacs/build.rs declares
      # rerun-if-env-changed=NEOMACS_BUILD_PROFILE - or the second step would
      # refingerprint and rebuild instead of reusing this.  `-p neomacs` covers
      # neomacs, neomacsclient and mock-display; they are bins of one package.
      - name: Compile release binaries
        env:
          NEOMACS_BUILD_PROFILE: release
        run: >-
          cargo build -p neomacs
          --features video,neomacs-layout-engine/freetype-bundled
          --profile release

      - name: Bootstrap and dump
        run: cargo xtask fresh-build --release --features neomacs-layout-engine/freetype-bundled --skip-build

      - name: Configure release version
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1 ||
            git tag "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Package .deb
        if: matrix.arch == 'x86_64'
        run: ./scripts/package-deb.sh --target "${{ matrix.target }}" --skip-build --no-smoke

      - name: Package tarball
        if: matrix.arch == 'aarch64'
        run: ./scripts/package-release.sh --target "${{ matrix.target }}" --skip-build --no-smoke

      - name: Verify Debian package
        if: matrix.arch == 'x86_64'
        run: |
          ./scripts/test-linux-release-artifacts.sh \
            --target "${{ matrix.target }}" \
            --formats deb

      - name: Verify tarball
        if: matrix.arch == 'aarch64'
        run: |
          ./scripts/test-linux-release-artifacts.sh \
            --target "${{ matrix.target }}" \
            --tar-version "$VERSION" \
            --formats tar

      - name: Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: build Windows ${{ matrix.arch }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dist/*.zip
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: dist/*.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      NEOMACS_RELEASE_TARGET: ${{ matrix.target }}
      GSTREAMER_VERSION: 1.26.9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore GStreamer SDK cache
        if: matrix.arch == 'x86_64'
        id: cache-gstreamer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}\PFiles64
            ${{ github.workspace }}\gstreamer-msi-cache
          key: windows-gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}-v3

      - name: Install GStreamer SDK
        if: matrix.arch == 'x86_64' && steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/setup-windows-gstreamer.ps1 -Install

      - name: Save GStreamer SDK cache
        if: ${{ !cancelled() && matrix.arch == 'x86_64' && steps.cache-gstreamer.outputs.cache-hit != 'true' && hashFiles('PFiles64/gstreamer/1.0/msvc_x86_64/bin/pkg-config.exe') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}\PFiles64
            ${{ github.workspace }}\gstreamer-msi-cache
          key: ${{ steps.cache-gstreamer.outputs.cache-primary-key }}

      - name: Configure GStreamer SDK
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: ./scripts/setup-windows-gstreamer.ps1

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-windows-msvc-${{ matrix.arch }}
          cache-workspace-crates: true
          target: ${{ matrix.target }}

      - name: Disable ThinLTO on Windows aarch64
        if: matrix.arch == 'aarch64'
        shell: bash
        # rustc 1.96.1 crashes with STATUS_ACCESS_VIOLATION during ARM64 ThinLTO.
        run: echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"

      # Split so a compile failure is distinguishable from a bootstrap failure.
      # The args must match xtask's initial_cargo_build_args EXACTLY, including
      # NEOMACS_BUILD_PROFILE, which crates/neomacs/build.rs declares
      # rerun-if-env-changed on - otherwise the bootstrap step refingerprints
      # and rebuilds instead of reusing this.
      - name: Compile release binaries
        shell: bash
        timeout-minutes: 150
        env:
          NEOMACS_BUILD_PROFILE: release
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            source scripts/windows-gstreamer-env.sh
          fi
          cargo build -p neomacs --features neomacs-layout-engine/freetype-bundled --profile release

      - name: Bootstrap and dump
        shell: bash
        timeout-minutes: 60
        run: |
          # The pdump generation runs neomacs, whose startup expands `~`. The
          # minimal CI build environment sets USERPROFILE/APPDATA but not HOME,
          # so `~` would stay literal and `directory-files "~"` would fail. Give
          # it HOME explicitly (a real Windows session always has one; GNU's
          # w32.c init_environment likewise guarantees HOME is set).
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            source scripts/windows-gstreamer-env.sh
          fi
          export HOME="${USERPROFILE:-$GITHUB_WORKSPACE}"
          cargo xtask fresh-build --release --features neomacs-layout-engine/freetype-bundled --skip-build

      - name: Verify GStreamer pkg-config
        if: matrix.arch == 'x86_64'
        shell: bash
        run: source scripts/windows-gstreamer-env.sh --verify

      - name: Configure release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1 ||
            git tag "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Build and package portable zip (x86_64-pc-windows-msvc)
        if: matrix.arch == 'x86_64'
        shell: pwsh
        timeout-minutes: 160
        run: |
          # pdump startup expands "~"; hosted Windows jobs may not define HOME.
          $env:HOME = if ($env:USERPROFILE) { $env:USERPROFILE } else { $env:GITHUB_WORKSPACE }
          ./scripts/emacs-build.ps1 -SkipBuild -Version $env:VERSION

      - name: Package zip (aarch64-pc-windows-msvc)
        if: matrix.arch == 'aarch64'
        shell: bash
        run: |
          TARGET="$NEOMACS_RELEASE_TARGET"
          STAGING="neomacs-${VERSION}-${TARGET}"
          mkdir -p "$STAGING"
          cp target/release/neomacs.exe "$STAGING/"
          cp target/release/neomacsclient.exe "$STAGING/"
          cp target/release/cmdproxy.exe "$STAGING/"
          cp target/release/neomacs.pdump "$STAGING/"
          cp -r lisp "$STAGING/"
          cp -r etc "$STAGING/"
          cp COPYING "$STAGING/"
          mkdir -p dist
          7z a -tzip "dist/${STAGING}.zip" "$STAGING"

      - name: Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
